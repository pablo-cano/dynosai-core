[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynosai-core"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dynos = "dynosai.cli:main"

[tool.hatch.version]
path = "src/dynosai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dynosai"]

# Explicit sdist selection: hatchling's default file selection follows versioned
# ignore rules only, which would embed machine-local development harness state
# into the sdist (FR-010, constitution IX).
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
]

[dependency-groups]
dev = ["pytest"]
